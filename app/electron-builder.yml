appId: io.github.svichas.gnomi
productName: Gnomi
# Without it Windows and Linux builds take the npm name "@gnomi/app", which is not a valid file name.
executableName: Gnomi
copyright: Copyright © Stefanos Vichas
directories:
  output: dist
# electron-vite bundles the engine and the simulation into out/; their npm dependencies come in through node_modules.
files:
  - out/**
  - package.json
  - '!node_modules/@gnomi/**'
icon: ../assets/brand/gnomi-app-icon.png
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # The in-app update installs from the zip; the dmg is only for a first install.
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
publish:
  provider: github
  owner: svichas
  repo: Gnomi
  releaseType: draft
