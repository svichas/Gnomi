name: Release

# Push a tag that matches app/package.json's version (v0.1.0 for 0.1.0). Each platform uploads its installer to one
# draft release, which you publish by hand once every job is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @gnomi/app
      - run: |
          # An unset secret arrives as an empty string, which electron-builder reads as a certificate path and fails on.
          # Without a certificate the Mac app is signed ad hoc: Apple silicon calls a downloaded arm64 app with
          # electron-builder's broken leftover signature "damaged". Hardened runtime is only for notarization, and with ad
          # hoc signing it would refuse to load Electron's own frameworks.
          [ -n "$CSC_LINK" ] || { unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; adhoc='-c.mac.identity=- -c.mac.hardenedRuntime=false'; }
          npx electron-builder ${{ matrix.platform }} --publish always $adhoc
        shell: bash
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization run only when these secrets are set; without them the .dmg is unsigned. Other jobs
          # get an empty CSC_LINK, which unsets them all, since electron-builder would sign a Windows installer with it.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
